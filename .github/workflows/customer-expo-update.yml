# Publishes the customer app to the Expo "preview" branch after every merge to main,
# so the Expo Go share link and the Android preview app get the new version.
# Needs the EXPO_TOKEN repository secret (see docs/sharing-the-customer-app.md).
name: Customer app Expo update

on:
  push:
    branches: [main]
    paths:
      - 'apps/customer/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: customer-expo-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the Expo token
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN isn't set yet, so there's nothing to publish. Add it in Settings > Secrets and variables > Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: pnpm

      - uses: expo/expo-github-action@v8
        if: steps.token.outputs.ok == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        if: steps.token.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish to the preview branch
        if: steps.token.outputs.ok == 'true'
        working-directory: apps/customer
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'Manual update' }}
        run: eas update --branch preview --environment preview --non-interactive --message "$(echo "$MESSAGE" | head -n 1)"
